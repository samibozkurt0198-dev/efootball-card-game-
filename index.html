<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eFootball Ultimate Manager</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
    body { background: #080a0f; color: #fff; padding-bottom: 80px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .header { width: 100%; background: #11141d; padding: 12px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #222838; position: sticky; top: 0; z-index: 100; }
    .coin-badge { background: #1a1e2b; border: 1px solid #ffd700; color: #ffd700; padding: 6px 14px; border-radius: 20px; font-weight: bold; }
    
    .view-section { display: none; width: 100%; max-width: 500px; padding: 15px; }
    .active-view { display: block; }

    .pack-card { background: #11141d; border: 1px solid #222838; border-radius: 12px; padding: 15px; margin-bottom: 12px; text-align: center; }
    .btn-main { background: #0099ff; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; flex: 1; }
    
    .inventory-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .delete-all-btn { background: #ff4d4d; color: white; padding: 5px 10px; border-radius: 5px; border: none; cursor: pointer; font-size: 11px; }
    
    .inventory-list { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; min-height: 110px; }
    .ef-card { width: 70px; height: 90px; background: #1e2436; border-radius: 8px; border: 1px solid #ffd700; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; flex-shrink: 0; padding: 4px; }
    .delete-btn { position: absolute; top: 2px; right: 2px; color: #ff4d4d; cursor: pointer; background: rgba(0,0,0,0.6); border-radius: 50%; width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; font-size: 10px; }

    .navbar { position: fixed; bottom: 0; width: 100%; background: #11141d; border-top: 1px solid #222838; display: flex; justify-content: space-around; padding: 15px 0; }
    .nav-item { color: #aaa; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .nav-item.active { color: #0099ff; }
  </style>
</head>
<body>

  <div class="header">
    <span>Samet</span>
    <div class="coin-badge"><i class="fa-solid fa-coins"></i> <span id="coin-count">1000000</span></div>
  </div>

  <div id="view-shop" class="view-section active-view">
    <h3>Paket Mağazası</h3>
    <div id="pack-container" style="margin-top: 15px;"></div>
    <div id="pack-result" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:15px; justify-content:center;"></div>
  </div>

  <div id="view-squad" class="view-section">
    <div class="inventory-header">
      <h3>Adaylarım</h3>
      <button class="delete-all-btn" onclick="deleteAllPlayers()">Tümünü Sil</button>
    </div>
    <div class="inventory-list" id="my-players-list"></div>
  </div>

  <div class="navbar">
    <div class="nav-item active" onclick="switchTab('shop', this)"><i class="fa-solid fa-store"></i>Mağaza</div>
    <div class="nav-item" onclick="switchTab('squad', this)"><i class="fa-solid fa-shirt"></i>Kadro</div>
  </div>

  <script>
    // 5 Farklı Paket ve Her Birine Özel 20'şer Benzersiz Oyuncu
    const packs = [
      { id: 'icon', name: 'Efsane ICON', price: 100000, color: '#e6007e', pool: [
        {name: "Ronaldo Nazario", rating: 98}, {name: "Ronaldinho", rating: 97}, {name: "Maradona", rating: 98}, {name: "Pele", rating: 99},
        {name: "Zidane", rating: 96}, {name: "Maldini", rating: 95}, {name: "Cruyff", rating: 96}, {name: "Kaka", rating: 94},
        {name: "Henry", rating: 95}, {name: "Gerrard", rating: 92}, {name: "Lampard", rating: 91}, {name: "Xavi", rating: 93},
        {name: "Pirlo", rating: 93}, {name: "R. Carlos", rating: 92}, {name: "Puyol", rating: 92}, {name: "Casillas", rating: 93},
        {name: "Vieira", rating: 94}, {name: "Beckham", rating: 91}, {name: "Van Basten", rating: 94}, {name: "Figo", rating: 92}
      ]},
      { id: 'dunya', name: 'Dünya Kupası', price: 75000, color: '#ff4500', pool: [
        {name: "Messi", rating: 96}, {name: "Mbappe", rating: 95}, {name: "Modric", rating: 89}, {name: "Griezmann", rating: 88},
        {name: "E. Martinez", rating: 87}, {name: "Hakimi", rating: 86}, {name: "B. Fernandes", rating: 88}, {name: "Richarlison", rating: 84},
        {name: "Gakpo", rating: 83}, {name: "J. Alvarez", rating: 85}, {name: "Bellingham", rating: 90}, {name: "Van Dijk", rating: 89},
        {name: "Casemiro", rating: 88}, {name: "Bounou", rating: 85}, {name: "Gvardiol", rating: 84}, {name: "Bukayo Saka", rating: 87},
        {name: "Pedri", rating: 86}, {name: "Dembele", rating: 85}, {name: "Depay", rating: 83}, {name: "Koulibaly", rating: 85}
      ]},
      { id: 'prime', name: 'Prime All-Stars', price: 150000, color: '#ffd700', pool: [
        {name: "C. Ronaldo", rating: 94}, {name: "Haaland", rating: 94}, {name: "De Bruyne", rating: 93}, {name: "Vinicius Jr", rating: 92},
        {name: "Salah", rating: 92}, {name: "Kane", rating: 91}, {name: "Lewandowski", rating: 91}, {name: "Courtois", rating: 90},
        {name: "Ruben Dias", rating: 89}, {name: "Rodri", rating: 92}, {name: "Lautaro M.", rating: 88}, {name: "B. Silva", rating: 88},
        {name: "Kvaratskhelia", rating: 86}, {name: "Osimhen", rating: 89}, {name: "Valverde", rating: 88}, {name: "A. Davies", rating: 85},
        {name: "T. Hernandez", rating: 86}, {name: "Odegaard", rating: 89}, {name: "Musiala", rating: 87}, {name: "Alisson", rating: 89}
      ]},
      { id: 'gencler', name: 'Geleceğin Yıldızları', price: 50000, color: '#00ffcc', pool: [
        {name: "Yamal", rating: 85}, {name: "Endrick", rating: 84}, {name: "Mainoo", rating: 83}, {name: "Gavi", rating: 86},
        {name: "Wirtz", rating: 88}, {name: "Simons", rating: 85}, {name: "Tel", rating: 82}, {name: "Zaïre-Emery", rating: 82},
        {name: "Cubarsi", rating: 81}, {name: "Yildiz", rating: 81}, {name: "Sesko", rating: 83}, {name: "Hojlund", rating: 84},
        {name: "Garnacho", rating: 83}, {name: "Tel", rating: 82}, {name: "Lewis", rating: 81}, {name: "Bynoe-Gittens", rating: 80},
        {name: "Vermeeren", rating: 80}, {name: "Ferguson", rating: 81}, {name: "Barrios", rating: 80}, {name: "Araujo", rating: 80}
      ]},
      { id: 'lig', name: 'Süper Lig Seçkisi', price: 40000, color: '#f5c518', pool: [
        {name: "Icardi", rating: 86}, {name: "Osayi-Samuel", rating: 81}, {name: "Ferdi", rating: 82}, {name: "Fred", rating: 83},
        {name: "Kerem A.", rating: 80}, {name: "Tadic", rating: 84}, {name: "Szymanski", rating: 82}, {name: "Torreira", rating: 83},
        {name: "Muslera", rating: 82}, {name: "Djiku", rating: 81}, {name: "Barış A. Y.", rating: 80}, {name: "Mertens", rating: 81},
        {name: "Livakovic", rating: 82}, {name: "Cengiz Ü.", rating: 80}, {name: "Söyüncü", rating: 81}, {name: "Sanchez", rating: 82},
        {name: "Semih K.", rating: 79}, {name: "Gedson", rating: 81}, {name: "Rafa Silva", rating: 83}, {name: "Immobile", rating: 84}
      ]}
    ];

    let currentUser = { coins: 1000000 };
    let myInventory = JSON.parse(localStorage.getItem('my_inventory') || '[]');

    function renderShop() {
      const container = document.getElementById('pack-container');
      packs.forEach(p => {
        container.innerHTML += `
          <div class="pack-card" style="border-left: 5px solid ${p.color}">
            <div style="font-weight:bold; margin-bottom:10px;">${p.name}</div>
            <div style="display:flex; gap:5px;">
              <button class="btn-main" onclick="openPack('${p.id}', 1)">1x</button>
              <button class="btn-main" onclick="openPack('${p.id}', 5)">5x</button>
              <button class="btn-main" onclick="openPack('${p.id}', 10)">10x</button>
            </div>
          </div>
        `;
      });
    }

    function openPack(packId, count) {
      const pack = packs.find(p => p.id === packId);
      const totalCost = pack.price * count;
      if(currentUser.coins < totalCost) return alert("Coin yetersiz!");
      
      currentUser.coins -= totalCost;
      document.getElementById('coin-count').innerText = currentUser.coins;

      const resultDiv = document.getElementById('pack-result');
      resultDiv.innerHTML = '';

      for(let i=0; i<count; i++) {
        const player = pack.pool[Math.floor(Math.random() * pack.pool.length)];
        const newPlayer = {...player, uid: Date.now() + i};
        myInventory.push(newPlayer);
        resultDiv.innerHTML += `
          <div class="ef-card">
            <span style="font-size:14px; font-weight:bold; color:#ffd700;">${newPlayer.rating}</span>
            <span style="font-size:8px; text-align:center;">${newPlayer.name}</span>
          </div>
        `;
      }
      saveData();
    }

    function renderInventory() {
      const list = document.getElementById('my-players-list');
      list.innerHTML = '';
      myInventory.forEach((p, index) => {
        list.innerHTML += `
          <div class="ef-card">
            <div class="delete-btn" onclick="deleteSingle(${index})">X</div>
            <span style="font-size:14px; font-weight:bold; color:#ffd700;">${p.rating}</span>
            <span style="font-size:8px; text-align:center;">${p.name}</span>
          </div>
        `;
      });
    }

    function deleteSingle(index) {
      myInventory.splice(index, 1);
      saveData();
      renderInventory();
    }

    function deleteAllPlayers() {
      if(confirm("Tümünü sil?")) {
        myInventory = [];
        saveData();
        renderInventory();
      }
    }

    function saveData() { localStorage.setItem('my_inventory', JSON.stringify(myInventory)); }

    function switchTab(tab, el) {
      document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('view-' + tab).classList.add('active-view');
      el.classList.add('active');
      if(tab === 'squad') renderInventory();
    }

    renderShop();
    renderInventory();
  </script>
</body>
</html>
